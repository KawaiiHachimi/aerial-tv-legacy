<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aerial Legacy</title>
<style>body{font:16px system-ui,sans-serif;background:#111218;color:#f5f5f7;margin:0}main{max-width:600px;margin:auto;padding:28px 20px 64px}h1{font-size:30px;margin-bottom:6px}h2{font-size:20px;margin-top:30px}p,small{color:#b7b9c5;line-height:1.6}button,select,input{font:inherit}button,select{padding:12px;border-radius:12px;border:1px solid #444655;background:#292b36;color:white;margin:4px 4px 4px 0}button:disabled{opacity:.5}label{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #333}input[type=checkbox]{width:22px;height:22px}#msg{min-height:28px;position:sticky;top:0;background:#111218;padding:10px 0;color:#a3e3c3}#caption{font-size:13px}.choices{display:flex;flex-wrap:wrap}.choices img{display:block;width:100%;border-radius:8px;margin-bottom:8px}.choices button[data-preset]{width:calc(50% - 6px);font-size:13px;text-align:left}.choices button.active{border:2px solid #b6d4ff;background:#384862}input[type=file]{max-width:100%;padding:14px 0}</style>
<main><h1>Aerial Legacy</h1><p>Android 4.3 · 手机配置 / Phone setup</p><div id="msg" role="status">正在连接 / Connecting…</div>
<h2>壁纸 / Wallpaper</h2><div class="choices"><button id="bing">必应每日 / Bing Daily</button><button id="photo">手机照片 / My photo</button></div><button id="refresh">更新必应 / Refresh Bing</button><p id="caption"></p>
<div id="builtins" class="choices"></div><h2>上传照片 / Upload a photo</h2><p>JPEG、PNG、WebP，最大 8 MB。上传成功即设为壁纸；电视保留最新一张照片。</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">上传并使用 / Upload &amp; apply</button>
<h2>桌面 / Home</h2><label>应用名称 / App names<select id="name_mode"><option value="0">全部显示 / Show all</option><option value="1">仅选中 / Selected only</option><option value="2">全部隐藏 / Hide all</option></select></label><label>高对比焦点 / High contrast<input data-key="contrast" type="checkbox"></label><label>玻璃底板 / Glass shelf<input data-key="plate" type="checkbox"></label><label>大时钟 / Large clock<input data-key="large_clock" type="checkbox"></label><label>按键声音 / Key sounds<input data-key="sounds" type="checkbox"></label><label>屏保 / Screensaver<select id="idle"><option value="0">永不 / Never</option><option value="1">1 min</option><option value="2">2 min</option><option value="5">5 min</option><option value="10">10 min</option></select></label>
<p>电视与手机需保持同一网络。退出桌面或配置窗口关闭一段时间后，此链接失效；请在电视重新打开「手机配置」。照片只保存在电视。</p></main>
<script>
const $=s=>document.querySelector(s);let state={},pending=false;
const names=['Hills · Dawn','Hills · Dusk','Hills · Mist','Hills · Night','Dunes · Gold','Dunes · Moonlight','Sea · Sunset','Sea · Clear Sky','Waves · Blue','Waves · Coral','Waves · Violet','Glow · Pink','Aurora','Glow · Lime','Aerial Dusk'];
async function api(path,value,raw){let response=await fetch('api/'+path,value===undefined?{cache:'no-store'}:{method:'POST',headers:{'X-Aerial-Request':'1','Content-Type':raw?'application/octet-stream':'application/json'},body:raw?value:JSON.stringify(value)});if(!response.ok)throw new Error(await response.text());return response.json()}
function paint(s){state=s;document.querySelectorAll('[data-key]').forEach(x=>x.checked=!!s[x.dataset.key]);$('#idle').value=s.idle;$('#name_mode').value=s.name_mode;$('#photo').disabled=!s.photo;$('#bing').classList.toggle('active',s.source==='bing');$('#photo').classList.toggle('active',s.source==='photo');document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',s.source==='builtin'&&+x.dataset.preset===s.preset));$('#caption').textContent=s.caption||'';$('#msg').textContent=s.busy?'正在获取必应 / Loading Bing…':s.status||'已连接 / Connected'}
async function apply(path,value,raw){if(pending)return;pending=true;$('#msg').textContent='正在保存 / Saving…';try{paint(await api(path,value,raw))}catch(e){$('#msg').textContent=e.message||'连接已失效，请在电视重新打开手机配置。'}finally{pending=false}}
names.forEach((name,i)=>{let b=document.createElement('button');let img=document.createElement('img');img.src='api/preview?source=builtin&preset='+i;img.alt='';img.loading='lazy';b.appendChild(img);b.appendChild(document.createTextNode(name));b.dataset.preset=i;b.onclick=()=>apply('wallpaper',{source:'builtin',preset:i});$('#builtins').appendChild(b)});
$('#bing').onclick=()=>apply('wallpaper',{source:'bing'});$('#photo').onclick=()=>apply('wallpaper',{source:'photo'});$('#refresh').onclick=()=>apply('refresh',{});document.querySelectorAll('[data-key]').forEach(x=>x.onchange=()=>apply('settings',{[x.dataset.key]:x.checked}));$('#name_mode').onchange=()=>apply('settings',{name_mode:+$('#name_mode').value});$('#idle').onchange=()=>apply('settings',{idle:+$('#idle').value});$('#upload').onclick=()=>{let f=$('#file').files[0];if(!f){$('#msg').textContent='请先选择照片 / Choose a photo';return}if(f.size>8*1024*1024){$('#msg').textContent='照片超过 8 MB / Image too large';return}apply('upload',f,true)};
async function poll(){if(!pending)try{paint(await api('state'))}catch(e){$('#msg').textContent='连接已失效。请在电视重新打开手机配置 / Reopen setup on TV'}setTimeout(poll,4000)}poll();
</script></html>
